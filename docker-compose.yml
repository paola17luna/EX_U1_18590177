services:

  db:
    image: postgres:16
    container_name: blogtec-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogtec
      POSTGRES_USER: blogtec_user
      POSTGRES_PASSWORD: blogtec_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  blogtec:
    image: blogtec:1.0.0
    container_name: blogtec-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://blogtec_user:blogtec_pass@db:5432/blogtec
    ports:
      - "8000:8000"

volumes:
  postgres_data: